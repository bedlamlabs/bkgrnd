[package]
name = "bkgrnd"
version = "1.0.0"
description = "bkgrnd — macOS Menubar YouTube Audio Player"
authors = ["Geoff McCaleb"]
license = "MIT"
edition = "2021"

[lib]
name = "bkgrnd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "fs", "sync", "process"] }
dirs = "6"
url = "2"
regex = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
