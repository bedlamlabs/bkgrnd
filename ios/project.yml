name: bkgrnd
options:
  bundleIdPrefix: com.bedlamlabs
  deploymentTarget:
    iOS: "17.0"
targets:
  bkgrnd:
    type: application
    platform: iOS
    sources:
      - path: bkgrnd/Sources
      - path: bkgrnd/Resources
    # Real Info.plist (generated by xcodegen): INFOPLIST_KEY_* build settings
    # silently DROP unsupported keys — UIBackgroundModes never made it into
    # the built plist that way, so iOS suspended the app on background.
    info:
      path: bkgrnd/Info.plist
      properties:
        CFBundleDisplayName: bkgrnd
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bedlamlabs.bkgrnd.ios
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 45CY38F39L
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
