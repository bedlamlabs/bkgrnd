name: bkgrnd
options:
  bundleIdPrefix: com.bedlamlabs
  deploymentTarget:
    iOS: "17.0"
targets:
  bkgrnd:
    type: application
    platform: iOS
    sources:
      - path: bkgrnd/Sources
      - path: bkgrnd/Resources
    # Real Info.plist (generated by xcodegen): INFOPLIST_KEY_* build settings
    # silently DROP unsupported keys — UIBackgroundModes never made it into
    # the built plist that way, so iOS suspended the app on background.
    info:
      path: bkgrnd/Info.plist
      properties:
        CFBundleDisplayName: bkgrnd
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # CarPlay audio scene. The SwiftUI WindowGroup keeps owning the phone
        # window scene automatically; we only declare the CarPlay scene role.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bedlamlabs.bkgrnd.ios
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 45CY38F39L
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # CarPlay AUDIO entitlement — App ID registered + CarPlay capability
        # enabled 2026-07-08.
        CODE_SIGN_ENTITLEMENTS: bkgrnd/bkgrnd.entitlements
    scheme:
      testTargets: []
