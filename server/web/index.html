<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bkgrnd</title>

    <meta name="theme-color" content="#0d0e11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=30" />

    <link rel="manifest" href="manifest.webmanifest?v=30" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=30" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-row">
        <div class="brand"><i>b</i>kgrnd</div>
        <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Zm8.2 4.8a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.4 1a7.2 7.2 0 0 0-1.7-1l-.3-2.6h-4l-.4 2.6a7.2 7.2 0 0 0-1.7 1l-2.3-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 1.9l-2 1.5 2 3.4 2.3-1a7.2 7.2 0 0 0 1.7 1l.4 2.6h4l.3-2.6a7.2 7.2 0 0 0 1.7-1l2.4 1 2-3.4-2-1.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <main id="authView" class="screen auth-screen">
      <div class="auth-card">
        <div class="brand auth-brand"><i>b</i>kgrnd</div>
        <h1 id="authTitle" class="auth-title">Sign in</h1>
        <input id="authUser" class="input" type="text" placeholder="Username" autocomplete="username" autocapitalize="none" spellcheck="false" />
        <input id="authPass" class="input" type="password" placeholder="Password" autocomplete="current-password" />
        <div id="authMsg" class="inline-msg hidden"></div>
        <button id="authSubmit" class="primary-btn auth-submit" type="button">Sign in</button>
        <button id="authToggle" class="ghost-btn auth-toggle" type="button">Create an account</button>
      </div>
    </main>

    <main id="homeView" class="screen active">
      <button id="openSearchBtn" class="searchrow" type="button">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.4" stroke="currentColor" stroke-width="1.4"/><path d="m10.4 10.4 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        Search, or paste a YouTube / Spotify URL
      </button>

      <div class="section-label"><h2>Streams</h2></div>
      <section id="mixGrid" class="mix-grid" aria-live="polite"></section>
    </main>

    <main id="searchView" class="screen">
      <div class="view-bar">
        <button id="closeSearchBtn" class="icon-btn" type="button" aria-label="Back">‹</button>
        <div>
          <div class="view-title">Search</div>
          <div id="searchScope" class="view-subtitle">Recent</div>
        </div>
        <div class="spacer"></div>
      </div>
      <div class="search-box">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.4" stroke="currentColor" stroke-width="1.4"/><path d="m10.4 10.4 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input
          id="searchInput"
          type="text"
          placeholder="Search, or paste a YouTube / Spotify URL"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
        />
        <button id="clearSearchBtn" class="clear-btn" type="button" aria-label="Clear">×</button>
      </div>
      <div id="searchMsg" class="inline-msg hidden"></div>
      <section id="searchResults" class="result-list"></section>
    </main>

    <main id="playerView" class="screen stage">
      <div class="stage-fill" id="playerAmbient" aria-hidden="true"></div>
      <img id="playerArt" class="stage-art" alt="" />
      <div id="playerArtFallback" class="stage-art-fallback hidden" aria-hidden="true">b</div>
      <div class="stage-grain" aria-hidden="true"></div>

      <div class="stage-inner">
        <div class="stage-top">
          <span class="chip"><span class="chip-dot" aria-hidden="true"></span><span id="playerStatusTag">streaming</span></span>
          <div class="stage-actions">
            <span id="stageQueueChip" class="chip hidden"></span>
            <button id="castBtn" class="ghost-icon hidden" type="button" aria-label="Cast to a device">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 12.4a1.6 1.6 0 0 1 1.6 1.6M2 9.8a4.2 4.2 0 0 1 4.2 4.2M2 7.2A6.8 6.8 0 0 1 8.8 14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M2 4.2V3.4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v9.2a1 1 0 0 1-1 1h-2.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="shareBtn" class="ghost-icon" type="button" aria-label="Share">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 10V2.6M8 2.6 5.4 5.2M8 2.6l2.6 2.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.4 8.6v3.6a1.2 1.2 0 0 0 1.2 1.2h6.8a1.2 1.2 0 0 0 1.2-1.2V8.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </button>
            <button id="closePlayerBtn" class="ghost-icon" type="button" aria-label="Browse streams">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2.25" y="2.25" width="4.3" height="4.3" rx="1" stroke="currentColor" stroke-width="1.35"/><rect x="9.45" y="2.25" width="4.3" height="4.3" rx="1" stroke="currentColor" stroke-width="1.35"/><rect x="2.25" y="9.45" width="4.3" height="4.3" rx="1" stroke="currentColor" stroke-width="1.35"/><rect x="9.45" y="9.45" width="4.3" height="4.3" rx="1" stroke="currentColor" stroke-width="1.35"/></svg>
            </button>
          </div>
        </div>

        <div class="stage-copy">
          <div id="stageKicker" class="stage-kicker"></div>
          <h1 id="playerTitle" class="stage-title">Nothing playing</h1>
          <p id="playerSub" class="stage-sub"></p>
          <div class="stage-progress" aria-label="Playback progress">
            <div class="rail" id="progressTrack">
              <span class="rail-fill" id="progressFill"></span>
              <span class="rail-knob" id="progressKnob"></span>
            </div>
            <div class="stage-times">
              <span id="elapsedTime">0:00</span>
              <span id="durationTime">--:--</span>
            </div>
          </div>
          <div class="stage-controls">
            <button id="bookmarkBtn" class="s-btn quiet bookmark" type="button" aria-label="Save to library" aria-pressed="false">
              <svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M5 3.4h8a.7.7 0 0 1 .7.7v10.5l-4.7-2.9-4.7 2.9V4.1a.7.7 0 0 1 .7-.7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            </button>
            <button id="seekBackBtn" class="s-btn" type="button" aria-label="Back 15 seconds">
              <svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M10.4 4.2 5.8 9l4.6 4.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 4.2 8.4 9l4.6 4.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="playerPauseBtn" class="s-btn primary" type="button" aria-label="Pause">Ⅱ</button>
            <button id="seekForwardBtn" class="s-btn" type="button" aria-label="Forward 15 seconds">
              <svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="m7.6 4.2 4.6 4.8-4.6 4.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="m5 4.2 4.6 4.8L5 13.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="playerStopBtn" class="s-btn quiet stop" type="button" aria-label="Stop">
              <svg viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><rect x="5.3" y="5.3" width="7.4" height="7.4" rx="1.6"/></svg>
            </button>
          </div>
        </div>
      </div>
    </main>

    <div id="miniPlayer" class="mini-player hidden" role="button" tabindex="0" aria-label="Open player">
      <img id="miniArt" class="mini-art" alt="" />
      <div class="mini-meta">
        <div id="miniTitle" class="mini-title"></div>
        <div id="miniSub" class="mini-sub"></div>
      </div>
      <button id="miniAction" class="mini-action" type="button" aria-label="Play or pause">Ⅱ</button>
    </div>

    <dialog id="settings" class="dialog">
      <form method="dialog" class="dialog-inner">
        <div class="dialog-h">Settings</div>
        <p class="hint">Signed in as <b id="settingsUser">—</b>. Leave Base URL blank when this app is served by bkgrnd.bedl.am.</p>
        <label class="label" for="baseUrl">Base URL</label>
        <input id="baseUrl" class="input" type="text" placeholder="(same origin)" />
        <div class="dialog-actions">
          <button class="primary-btn" value="default" type="submit">Save</button>
          <button id="logoutBtn" class="ghost-btn" value="cancel" type="button">Log out</button>
          <button class="ghost-btn" value="cancel" type="submit">Close</button>
        </div>
      </form>
    </dialog>

    <audio id="player" preload="none" playsinline></audio>
    <script src="app.js?v=30"></script>
  </body>
</html>
