<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bkgrnd</title>

    <meta name="theme-color" content="#08090d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=20" />

    <link rel="manifest" href="manifest.webmanifest?v=20" />
    <link rel="stylesheet" href="styles.css?v=20" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true"><span>b</span></div>
        <div class="brand">Bkgrnd</div>
        <button id="settingsBtn" class="settings-btn" type="button" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Zm8.2 4.8a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.4 1a7.2 7.2 0 0 0-1.7-1l-.3-2.6h-4l-.4 2.6a7.2 7.2 0 0 0-1.7 1l-2.3-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 1.9l-2 1.5 2 3.4 2.3-1a7.2 7.2 0 0 0 1.7 1l.4 2.6h4l.3-2.6a7.2 7.2 0 0 0 1.7-1l2.4 1 2-3.4-2-1.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <main id="homeView" class="screen active">
      <section class="scope-row" aria-label="Playback scope">
        <button id="remoteScopeBtn" class="pill active" type="button">Recent</button>
        <button id="localScopeBtn" class="pill" type="button">
          Remote
          <span id="localActiveDot" class="scope-dot hidden" aria-hidden="true"></span>
        </button>
        <button id="openSearchBtn" class="icon-btn search-btn" type="button" aria-label="Search or add">＋</button>
      </section>

      <section id="scopeStatus" class="scope-status hidden"></section>
      <section id="mixGrid" class="mix-grid" aria-live="polite"></section>
    </main>

    <main id="searchView" class="screen">
      <div class="view-bar">
        <button id="closeSearchBtn" class="icon-btn" type="button" aria-label="Back">‹</button>
        <div>
          <div class="view-title">Search</div>
          <div id="searchScope" class="view-subtitle">Recent</div>
        </div>
        <div class="spacer"></div>
      </div>
      <div class="search-box">
        <span aria-hidden="true">⌕</span>
        <input
          id="searchInput"
          type="text"
          placeholder="Search or paste YouTube URL"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
        />
        <button id="clearSearchBtn" class="clear-btn" type="button" aria-label="Clear">×</button>
      </div>
      <div id="searchMsg" class="inline-msg hidden"></div>
      <section id="searchResults" class="result-list"></section>
    </main>

    <main id="playerView" class="screen player-screen">
      <div class="np">
        <img id="playerAmbient" class="np-ambient" alt="" aria-hidden="true" />
        <div id="npSurface" class="np-surface">
          <img id="playerArt" class="np-art" alt="" />
          <div id="playerArtFallback" class="np-fallback hidden" aria-hidden="true">b</div>
          <div class="np-scrim"></div>
          <button id="closePlayerBtn" class="np-corner" type="button" aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span id="playerStatusBadge" class="np-badge hidden"><span class="np-dot"></span><span id="playerStatusTag" class="np-badge-text"></span></span>
          <button id="openPlaylistBtn" class="np-corner np-corner-right" type="button" aria-label="Playlist">
            <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.9"/><rect x="13" y="4" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.9"/><rect x="4" y="13" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.9"/><rect x="13" y="13" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.9"/></svg>
          </button>
          <div id="npControls" class="np-controls">
            <button id="seekBackBtn" class="np-ctrl" type="button" aria-label="Back 15 seconds">
              <svg viewBox="0 0 24 24" fill="none"><path d="M11 7 6 12l5 5M18 7l-5 5 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="playerStopBtn" class="np-ctrl" type="button" aria-label="Stop">
              <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
            <button id="playerPauseBtn" class="np-ctrl np-primary" type="button" aria-label="Pause">Ⅱ</button>
            <button id="seekForwardBtn" class="np-ctrl" type="button" aria-label="Forward 15 seconds">
              <svg viewBox="0 0 24 24" fill="none"><path d="m13 7 5 5-5 5M6 7l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="shareBtn" class="np-ctrl" type="button" aria-label="Share">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 15V4m0 0L8 8m4-4 4 4M6 13v5a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
        <div class="np-meta">
          <h1 id="playerTitle">Nothing playing</h1>
          <p id="playerSub"></p>
          <div class="player-progress" aria-label="Playback progress">
            <div class="progress-track" id="progressTrack">
              <span class="progress-fill" id="progressFill"></span>
              <span class="progress-knob" id="progressKnob"></span>
            </div>
            <div class="time-row">
              <span id="elapsedTime">0:00</span>
              <span id="durationTime">--:--</span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <main id="playlistView" class="screen">
      <div class="pl">
        <img id="playlistAmbient" class="np-ambient" alt="" aria-hidden="true" />
        <div class="pl-wrap">
          <div class="pl-top">
            <button id="closePlaylistBtn" class="pl-ic" type="button" aria-label="Back">
              <svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <span class="pl-lbl">Playlist</span>
            <button class="pl-ic on" type="button" aria-label="Playlist" disabled>
              <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.9"/><rect x="13" y="4" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.9"/><rect x="4" y="13" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.9"/><rect x="13" y="13" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.9"/></svg>
            </button>
          </div>
          <div id="playlistGrid" class="pl-grid"></div>
        </div>
      </div>
    </main>

    <div id="miniPlayer" class="mini-player hidden" role="button" tabindex="0" aria-label="Open player">
      <img id="miniArt" class="mini-art" alt="" />
      <div class="mini-meta">
        <div id="miniTitle" class="mini-title"></div>
        <div id="miniSub" class="mini-sub"></div>
      </div>
      <button id="miniAction" class="mini-action" type="button" aria-label="Play or pause">Ⅱ</button>
    </div>

    <dialog id="settings" class="dialog">
      <form method="dialog" class="dialog-inner">
        <div class="dialog-h">Settings</div>
        <p class="hint">Leave Base URL blank when this app is served by bkgrnd.bedl.am. Token is optional unless auth is enabled.</p>
        <label class="label" for="baseUrl">Base URL</label>
        <input id="baseUrl" class="input" type="text" placeholder="(same origin)" />
        <label class="label" for="token">Token</label>
        <input id="token" class="input" type="password" placeholder="WOPR token" autocomplete="off" />
        <div class="dialog-actions">
          <button class="primary-btn" value="default" type="submit">Save</button>
          <button class="ghost-btn" value="cancel" type="submit">Close</button>
        </div>
      </form>
    </dialog>

    <audio id="player" preload="none" playsinline></audio>
    <script src="app.js?v=20"></script>
  </body>
</html>
