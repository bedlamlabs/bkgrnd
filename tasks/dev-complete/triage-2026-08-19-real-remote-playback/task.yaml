summary: >
  Correct the prior delivery so arbitrary remote-controlled YouTube videos,
  not only the verifier URL and not only live streams, must actually advance
  before startup is considered successful and recover if playback stalls.

files_touched:
  - src-tauri/src/mpv.rs
  - src-tauri/src/player.rs
  - src-tauri/src/ytdlp.rs
  - scripts/verify-remote-playback-matrix.sh

acceptance_tests:
  - id: AT-1
    criterion: "A real remote command for an ordinary non-live YouTube video does not report usable playback until media position advances, and automatically tries the next resolver if the first session never becomes playable."
    traces_to: "Feature 1"
    verify:
      localhost:
        primary:
          tool: bash
          cmd: "cargo test --manifest-path src-tauri/Cargo.toml"
          expect: exit_0
      production:
        primary:
          tool: bash
          cmd: "bash scripts/verify-remote-playback-matrix.sh --startup"
          expect: contains "AT-1 PASS"
  - id: AT-2
    criterion: "A remote-controlled non-live YouTube video that stalls or exits abnormally moves to the next resolver strategy and resumes without user intervention."
    traces_to: "Feature 2"
    verify:
      localhost:
        primary:
          tool: bash
          cmd: "cargo test --manifest-path src-tauri/Cargo.toml"
          expect: exit_0
      production:
        primary:
          tool: bash
          cmd: "bash scripts/verify-remote-playback-matrix.sh --soak-seconds 95"
          expect: contains "AT-2 PASS"
  - id: AT-3
    criterion: "Real production remote playback advances for a plain video, a YouTube Mix URL, and a live stream from the user's history without counting the old verifier URL as evidence."
    traces_to: "Features 1 and 2"
    verify:
      localhost:
        primary:
          tool: bash
          cmd: "bash tasks/in-progress/triage-2026-08-19-real-remote-playback/tests/real-remote-playback.test.sh"
          expect: contains "AT-3 PASS"
      production:
        primary:
          tool: bash
          cmd: "bash scripts/verify-remote-playback-matrix.sh --matrix"
          expect: contains "AT-3 PASS"

