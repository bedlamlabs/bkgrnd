title: "Triage: real remote YouTube playback"
status: dev-complete
workflow_mode: turbo
triage: true
priority: P0
complexity: 6
issue_count: 2
ui_changes: false
non_web_task: true
domains: ["desktop", "remote-control", "playback", "youtube"]
