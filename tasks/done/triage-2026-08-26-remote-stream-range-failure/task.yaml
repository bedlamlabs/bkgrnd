id: "triage-2026-08-26-remote-stream-range-failure"
title: "Triage: 2 issues (remote progressive streams fail on HPX)"
status: done
workflow_mode: turbo
triage: true
complexity: 2
issue_count: 2
non_web_task: true
domains: [api, deployment]

production_verification_spec:
  base_url: "https://bkgrnd.bedl.am"

acceptance_tests:
  - id: AT-1
    criterion: "Progressive remote streams use safe bounded ranges and preserve exact client semantics without truncation."
    verify:
      localhost:
        primary:
          tool: bash
          cmd: "cargo test --manifest-path server/Cargo.toml progressive_"
          expect: exit_0
      production:
        primary:
          tool: bash
          cmd: "bash scripts/verify-hpx-remote-streaming.sh --ranges"
          expect: exit_0
  - id: AT-2
    criterion: "HPX uses the pinned POT provider then embedded and legacy fallbacks, accepting only fully probed media URLs."
    verify:
      localhost:
        primary:
          tool: bash
          cmd: "cargo test --manifest-path server/Cargo.toml hpx_resolver_"
          expect: exit_0
      production:
        primary:
          tool: bash
          cmd: "bash scripts/verify-hpx-remote-streaming.sh --resolver"
          expect: exit_0

