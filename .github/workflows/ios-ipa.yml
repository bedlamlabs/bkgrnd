name: iOS IPA (AltStore)

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive (no codesign)
        working-directory: ios
        run: >
          xcodebuild
          -project bkgrnd.xcodeproj
          -scheme bkgrnd
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath build/bkgrnd.xcarchive
          archive
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=''

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          rm -rf build/Payload bkgrnd.ipa
          mkdir -p build/Payload
          cp -R build/bkgrnd.xcarchive/Products/Applications/bkgrnd.app build/Payload/
          (cd build && /usr/bin/zip -qry ../bkgrnd.ipa Payload)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: bkgrnd-unsigned-ipa
          path: ios/bkgrnd.ipa

