<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bkgrnd</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">

    <!-- Idle View -->
    <div id="idleView" class="view">
      <input
        type="text"
        id="urlInput"
        class="url-input"
        placeholder="Search or Paste URL"
        autocomplete="off"
        spellcheck="false"
      />
      <div id="error" class="error hidden"></div>
      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <span id="loadingText">Connecting...</span>
      </div>
      <div id="searchResults" class="search-results hidden">
        <div class="section-header">
          <span class="section-title">Results</span>
          <button class="show-more" id="clearSearchBtn">Clear</button>
        </div>
        <div class="history-list" id="searchResultsList"></div>
      </div>
      <div id="idleHistorySection">
        <div class="divider"></div>
        <div class="section-header">
          <span class="section-title">Recent</span>
          <button class="show-more" id="showMoreBtn">Show All</button>
        </div>
        <div class="history-list" id="historyList"></div>
      </div>
    </div>

    <!-- Offline View -->
    <div id="offlineView" class="view hidden">
      <div class="offline-content">
        <div class="offline-message">Something went wrong</div>
        <button class="restart-btn" id="restartBtn">Restart</button>
      </div>
    </div>

    <!-- Playing View -->
    <div id="playingView" class="view hidden">
      <div class="now-playing">
        <div class="np-thumbnail" id="npThumbnail"></div>
        <div class="np-info">
          <div class="np-title" id="trackTitle"></div>
          <div class="np-subtitle" id="trackSubtitle"></div>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl-btn" id="prevBtn" title="Previous track">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <rect x="2" y="3" width="2" height="10" rx="0.5" fill="currentColor"/>
            <path d="M6 8L12 3.5V12.5L6 8Z" fill="currentColor"/>
          </svg>
        </button>
        <button class="ctrl-btn" id="seekBackBtn" title="Back 10s">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12.5 4V1L7.5 5L12.5 9V6C16.09 6 19 8.91 19 12.5C19 16.09 16.09 19 12.5 19C8.91 19 6 16.09 6 12.5H4C4 17.19 7.81 21 12.5 21C17.19 21 21 17.19 21 12.5C21 7.81 17.19 4 12.5 4Z" fill="currentColor"/>
            <text x="10" y="14.5" font-size="7" font-weight="700" fill="currentColor" text-anchor="middle" font-family="-apple-system, sans-serif">10</text>
          </svg>
        </button>
        <button class="ctrl-btn primary" id="pauseBtn" title="Pause">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" id="pauseIcon">
            <rect x="4" y="3" width="3.5" height="12" rx="1" fill="currentColor"/>
            <rect x="10.5" y="3" width="3.5" height="12" rx="1" fill="currentColor"/>
          </svg>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" id="playIcon" class="hidden">
            <path d="M5 3L15 9L5 15V3Z" fill="currentColor"/>
          </svg>
        </button>
        <button class="ctrl-btn" id="seekFwdBtn" title="Forward 10s">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M11.5 4V1L16.5 5L11.5 9V6C7.91 6 5 8.91 5 12.5C5 16.09 7.91 19 11.5 19C15.09 19 18 16.09 18 12.5H20C20 17.19 16.19 21 11.5 21C6.81 21 3 17.19 3 12.5C3 7.81 6.81 4 11.5 4Z" fill="currentColor"/>
            <text x="14" y="14.5" font-size="7" font-weight="700" fill="currentColor" text-anchor="middle" font-family="-apple-system, sans-serif">10</text>
          </svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" title="Next track">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M4 3.5L10 8L4 12.5V3.5Z" fill="currentColor"/>
            <rect x="12" y="3" width="2" height="10" rx="0.5" fill="currentColor"/>
          </svg>
        </button>
        <button class="ctrl-btn stop" id="stopBtn" title="Stop">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="2" y="2" width="10" height="10" rx="1.5" fill="currentColor"/>
          </svg>
        </button>
      </div>

      <div class="volume-row">
        <svg class="vol-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M5 9V15H9L14 20V4L9 9H5Z" fill="currentColor"/>
        </svg>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="75" />
        <svg class="vol-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M5 9V15H9L14 20V4L9 9H5Z" fill="currentColor"/>
          <path d="M18.5 12C18.5 10.23 17.48 8.71 16 7.97V16.02C17.48 15.29 18.5 13.77 18.5 12Z" fill="currentColor"/>
          <path d="M16 3.23V5.29C18.89 6.15 21 8.83 21 12C21 15.17 18.89 17.85 16 18.71V20.77C20.01 19.86 23 16.28 23 12C23 7.72 20.01 4.14 16 3.23Z" fill="currentColor"/>
        </svg>
      </div>

      <div class="divider"></div>

      <input
        type="text"
        id="urlInputPlaying"
        class="url-input small"
        placeholder="Search or Paste URL..."
        autocomplete="off"
        spellcheck="false"
      />
      <div id="playingHistory" class="playing-history hidden">
        <div class="history-list" id="playingHistoryList"></div>
      </div>
    </div>


  </div>

  <script src="main.js"></script>
</body>
</html>
