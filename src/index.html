<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bkgrnd</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container" id="appContainer">
    <section id="playerPanel" class="play-cover hidden" aria-live="polite">
      <div class="cover-stage">
        <div class="cover-art" aria-hidden="true"></div>

        <div class="subtle-top">
          <span class="micro-status" id="microStatus">
            <span class="pulse-dot"></span>
            <span id="microStatusText">Playing</span>
          </span>
          <button class="ghost-icon" id="playlistBtn" title="Open playlist" aria-label="Open playlist">
            <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <rect x="3.1" y="3.1" width="4.6" height="4.6" rx="1.05" stroke="currentColor" stroke-width="1.5"/>
              <rect x="10.3" y="3.1" width="4.6" height="4.6" rx="1.05" stroke="currentColor" stroke-width="1.5"/>
              <rect x="3.1" y="10.3" width="4.6" height="4.6" rx="1.05" stroke="currentColor" stroke-width="1.5"/>
              <rect x="10.3" y="10.3" width="4.6" height="4.6" rx="1.05" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </button>
        </div>

        <div class="cover-controls">
        <button class="control saved" id="bookmarkBtn" title="Remove from playlist" aria-label="Remove from playlist" disabled>
          <svg viewBox="0 0 18 18" fill="currentColor" aria-hidden="true">
            <path d="M5 3.2h8a.8.8 0 0 1 .8.8v10.55L9 11.6l-4.8 2.95V4A.8.8 0 0 1 5 3.2Z"/>
          </svg>
        </button>
        <button class="control" id="seekBackBtn" title="Back 10s" aria-label="Back 10 seconds" disabled>
          <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M10.4 4.2 5.8 9l4.6 4.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M13 4.2 8.4 9l4.6 4.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="control primary" id="pauseBtn" title="Pause" aria-label="Pause" disabled>
          <svg viewBox="0 0 18 18" fill="currentColor" id="pauseIcon" aria-hidden="true">
            <rect x="5" y="4" width="3" height="10" rx=".8"/>
            <rect x="10" y="4" width="3" height="10" rx=".8"/>
          </svg>
          <svg viewBox="0 0 18 18" fill="currentColor" id="playIcon" class="hidden" aria-hidden="true">
            <path d="M5.4 3.4 14 9l-8.6 5.6V3.4Z"/>
          </svg>
        </button>
        <button class="control" id="seekFwdBtn" title="Forward 10s" aria-label="Forward 10 seconds" disabled>
          <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="m7.6 4.2 4.6 4.8-4.6 4.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="m5 4.2 4.6 4.8L5 13.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="control stop" id="stopBtn" title="Stop" aria-label="Stop" disabled>
          <svg viewBox="0 0 18 18" fill="currentColor" aria-hidden="true">
            <rect x="5.3" y="5.3" width="7.4" height="7.4" rx="1.6"/>
          </svg>
        </button>
        </div>
      </div>

      <div class="cover-meta">
        <h1 class="stream-title" id="trackTitle">Nothing playing</h1>
        <div class="stream-subtitle" id="trackSubtitle">Search or paste a URL below</div>
        <div class="cover-progress">
          <div class="bar">
            <span class="fill" id="progressFill"></span>
            <span class="knob" id="progressKnob"></span>
          </div>
          <div class="time-row">
            <span id="elapsedTime">0:00</span>
            <span id="durationTime">--:--</span>
          </div>
        </div>
      </div>
    </section>

    <section id="gridView" class="playlist-grid">
      <button id="compactNow" class="compact-now hidden" type="button" title="Back to player">
        <div class="compact-cover" id="compactCover"></div>
        <div class="compact-copy">
          <div class="compact-kicker">Now playing</div>
          <div class="compact-title" id="compactTitle">Nothing playing</div>
          <div class="compact-sub" id="compactSub"></div>
        </div>
        <div class="compact-runtime" id="compactRuntime">--:--</div>
      </button>

      <div class="url-row">
        <input
          type="text"
          id="urlInput"
          placeholder="Search or Paste URL"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="url-add" id="submitInputBtn" type="button" aria-label="Submit">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 8h8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="m8.5 4 3.5 4-3.5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div id="error" class="error hidden"></div>
      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <span id="loadingText">Connecting...</span>
      </div>

      <div id="searchResults" class="grid-section hidden">
        <div class="grid-meta">
          <div class="grid-title">Results</div>
          <button class="soft-action" id="clearSearchBtn" type="button">Clear</button>
        </div>
        <div class="stream-grid" id="searchResultsList"></div>
      </div>

      <div id="librarySection" class="grid-section">
        <div class="grid-meta">
          <div class="grid-title">Streams</div>
          <div class="grid-note" id="gridNote">Playlist</div>
        </div>
        <div class="stream-grid" id="historyList"></div>
      </div>
    </section>

    <section id="offlineView" class="offline-view hidden">
      <div class="offline-content">
        <div class="offline-message">Something went wrong</div>
        <button class="restart-btn" id="restartBtn" type="button">Restart</button>
      </div>
    </section>
  </div>

  <script src="main.js"></script>
</body>
</html>
